[project]
name = "workplace-operations-agent"
version = "0.1.0"
description = "A cloud-oriented advisory AI workplace operations agent."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "pydantic>=2.8,<3.0",
  "pydantic-settings>=2.4,<3.0",
  "langchain>=0.3,<1.0",
  "langchain-core>=0.3,<1.0",
  "langgraph>=0.2,<1.0",
  "langchain-openai>=0.2,<1.0",
  "langchain-ollama>=0.2,<1.0",
  "langchain-huggingface>=0.1,<1.0",
  "pymupdf>=1.24,<2.0",
  "python-multipart>=0.0.9,<1.0",
  "httpx>=0.27,<1.0",
  "openai>=1.0,<3.0",
  "pymilvus>=2.4,<3.0",
  "boto3",
  "mangum>=0.19,<1.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8.3,<9.0",
  "pytest-asyncio>=0.24,<1.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
