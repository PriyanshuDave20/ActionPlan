AWSTemplateFormatVersion: "2010-09-09"
Description: AI Workplace Operations Agent - serverless backend resources.

Parameters:
  LambdaRoleName:
    Type: String
    Default: workplace-operations-lambda-role
  EcrRepositoryName:
    Type: String
    Default: workplace-operations-agent
  FunctionName:
    Type: String
    Default: ActionPlan
  WorkerFunctionName:
    Type: String
    Default: ActionPlanWorker
  MemoryMb:
    Type: Number
    Default: 1024
    MaxValue: 10240
    Description: Lambda memory in MB. The LangGraph graph calls NVIDIA and Zilliz and persists to DynamoDB; 128 MB was too small for reliable cold starts.
  WorkerMemoryMb:
    Type: Number
    Default: 2048
    MaxValue: 10240
    Description: Worker Lambda memory in MB. Worker needs more memory for LangGraph execution.
  TimeoutSeconds:
    Type: Number
    Default: 30
    MaxValue: 900
    Description: Lambda timeout in seconds. API Gateway synchronous integrations time out at ~29 seconds; this is intentionally just under that limit. Long-running graph executions should move to an async pattern (see Phase 5).
  WorkerTimeoutSeconds:
    Type: Number
    Default: 300
    MaxValue: 900
    Description: Worker Lambda timeout in seconds. Worker has higher timeout for long-running graph executions.
  EphemeralStorageMb:
    Type: Number
    Default: 512
    MaxValue: 5120
  WorkerEphemeralStorageMb:
    Type: Number
    Default: 1024
    MaxValue: 5120
    Description: Worker Lambda ephemeral storage in MB.
  DynamoDbTableName:
    Type: String
    Default: ActionPlanner
  ZillizDatabaseName:
    Type: String
    Default: db_c38709e8b8a4ab0
  ImageTag:
    Type: String
    Default: latest
  WorkerImageTag:
    Type: String
    Default: latest
  CodeBuildProjectName:
    Type: String
    Default: workplace-operations-agent-build
  CodeBuildServiceRoleName:
    Type: String
    Default: workplace-operations-codebuild-role
  CodeBuildLogLevel:
    Type: String
    Default: INFO
    AllowedValues: [INFO, ERROR]
  GitHubSourceLocation:
    Type: String
    Default: ""
  GitHubConnectionArn:
    Type: String
    Default: ""
  AmplifyDomain:
    Type: String
    Default: https://main.d2uczfq6giy37z.amplifyapp.com
  # Secrets are supplied out of band (Lambda console, Secrets Manager, or
  # secure parameter store) and marked NoEcho so values never appear in
  # CloudFormation output or logs.
  LlmApiKey:
    Type: String
    Default: ""
    NoEcho: true
    Description: LLM provider API key. Required when LLM_PROVIDER is nvidia/openai/openai-compatible. Supplied out of band.
  ZillizUri:
    Type: String
    Default: ""
    NoEcho: true
    Description: Zilliz endpoint URI. Required when VECTOR_STORE is zilliz. Supplied out of band.
  ZillizToken:
    Type: String
    Default: ""
    NoEcho: true
    Description: Zilliz auth token. Required when VECTOR_STORE is zilliz. Supplied out of band.

Conditions:
  HasGitHubSource:
    Fn::Not:
      - Fn::Equals:
          - !Ref GitHubSourceLocation
          - ""
  HasLlmApiKey:
    Fn::Not:
      - Fn::Equals:
          - !Ref LlmApiKey
          - ""
  HasZillizUri:
    Fn::Not:
      - Fn::Equals:
          - !Ref ZillizUri
          - ""
  HasZillizToken:
    Fn::Not:
      - Fn::Equals:
          - !Ref ZillizToken
          - ""

Resources:
  EcrRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: !Ref EcrRepositoryName
      ImageScanningConfiguration:
        ScanOnPush: true
      RepositoryPolicy:
        Version: "2012-10-17"
        Statement:
          - Sid: LambdaPull
            Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action:
              - ecr:BatchGetImage
              - ecr:GetDownloadUrlForLayer
            Condition:
              StringEquals:
                aws:SourceAccount: !Ref "AWS::AccountId"
          - Sid: AccountPush
            Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Action:
              - ecr:GetAuthorizationToken
              - ecr:BatchCheckLayerAvailability
              - ecr:GetDownloadUrlForLayer
              - ecr:GetRepositoryPolicy
              - ecr:DescribeRepositories
              - ecr:ListImages
              - ecr:DescribeImages
              - ecr:BatchGetImage
              - ecr:InitiateLayerUpload
              - ecr:UploadLayerPart
              - ecr:CompleteLayerUpload
              - ecr:PutImage

  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref LambdaRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBMemoryAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:Scan
                Resource: !Sub "arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${DynamoDbTableName}"

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref CodeBuildServiceRoleName
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: EcrPushAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:DescribeRepositories
                  - ecr:ListImages
                  - ecr:DescribeImages
                  - ecr:BatchGetImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub "arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrRepositoryName}"
        - PolicyName: CloudWatchLogsAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogStreams
                Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${CodeBuildProjectName}:*"
        - PolicyName: ReportAccess
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - codebuild:CreateReportGroup
                  - codebuild:CreateReport
                  - codebuild:UpdateReport
                  - codebuild:BatchPutTestCases
                  - codebuild:BatchPutCodeCoverages
                Resource: !Sub "arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:report/${CodeBuildProjectName}/*"

  CodeBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/codebuild/${CodeBuildProjectName}"
      RetentionInDays: 30

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Ref CodeBuildProjectName
      Description: Builds the Lambda container image and pushes to ECR
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
      TimeoutInMinutes: 30
      QueuedTimeoutInMinutes: 15
      BuildLogsConfig:
        CloudWatchLogs:
          Status: ENABLED
          GroupName: !Sub "/aws/codebuild/${CodeBuildProjectName}"
          StreamName: build
        S3Logs:
          Status: DISABLED
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        Type: LINUX_CONTAINER
        Image: aws/codebuild/standard:5.0
        ComputeType: BUILD_GENERAL1_SMALL
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: AWS_REGION
            Value: !Ref "AWS::Region"
          - Name: ECR_REPOSITORY_NAME
            Value: !Ref EcrRepositoryName
          - Name: IMAGE_TAG
            Value: !Ref ImageTag
      Source:
        Type: GITHUB
        Location: !If [HasGitHubSource, !Ref GitHubSourceLocation, !Ref "AWS::NoValue"]
        BuildSpec: buildspec.yml
        GitCloneDepth: 1
        GitHubConnectionArn: !If [HasGitHubSource, !Ref GitHubConnectionArn, !Ref "AWS::NoValue"]
      Tags:
        - Key: Project
          Value: workplace-operations-agent

  CodeBuildLogGroupLambda:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${FunctionName}"
      RetentionInDays: 30

  ApiGatewayApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub "${FunctionName}-api"
      ProtocolType: HTTP
      Description: HTTP API for the AI Workplace Operations Agent backend.
      CorsConfiguration:
        AllowOrigins:
          - !Ref AmplifyDomain
          - http://localhost:5173
          - http://127.0.0.1:5173
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
          - PATCH
        AllowHeaders:
          - "*"
        AllowCredentials: true
        MaxAge: 86400

  ApiGatewayIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref ApiGatewayApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !Sub
        - "arn:aws:apigateway:${Region}:lambda:path/2015-03-31/functions/${FunctionArn}/invocations"
        - Region: !Ref "AWS::Region"
          FunctionArn: !GetAtt LambdaFunction.Arn
      IntegrationMethod: POST
      PayloadFormatVersion: "2.0"
      TimeoutInMillis: 29000

  ApiGatewayRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref ApiGatewayApi
      RouteKey: "$default"
      AuthorizationType: NONE
      Target: !Join
        - "/"
        - - "integrations"
          - !Ref ApiGatewayIntegration

  ApiGatewayStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref ApiGatewayApi
      StageName: "$default"
      AutoDeploy: true
      AccessLogSettings:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: json

  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${FunctionName}"
      RetentionInDays: 30

  LambdaPermissionApiGateway:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref FunctionName
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub "arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${ApiGatewayApi}/*"

  LambdaFunction:
    Type: AWS::Lambda::Function
    DependsOn: LambdaExecutionRole
    Properties:
      FunctionName: !Ref FunctionName
      PackageType: Image
      Code:
        ImageUri: !Sub
          - "${AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}:${Tag}"
          - AccountId: !Ref "AWS::AccountId"
            Repo: !Ref EcrRepositoryName
            Tag: !Ref ImageTag
      Role: !GetAtt LambdaExecutionRole.Arn
      MemorySize: !Ref MemoryMb
      Timeout: !Ref TimeoutSeconds
      EphemeralStorage:
        Size: !Ref EphemeralStorageMb
      Architectures:
        - x86_64
      Environment:
        Variables:
          AWS_REGION: !Ref "AWS::Region"
          DATA_DIR: /tmp/data
          DYNAMODB_TABLE_NAME: !Ref DynamoDbTableName
          MEMORY_BACKEND: dynamodb
          LLM_PROVIDER: nvidia
          LLM_MODEL: nvidia/nemotron-3.5-lightning-30b-a3b
          LLM_BASE_URL: https://integrate.api.nvidia.com/v1
          EMBEDDING_PROVIDER: nvidia
          EMBEDDING_MODEL: nvidia/nemotron-3-embed-1b
          VECTOR_STORE: zilliz
          ZILLIZ_DATABASE: !Ref ZillizDatabaseName
          LANGCHAIN_TRACING_V2: "true"
          LANGCHAIN_PROJECT: workplace-operations-agent
          FRONTEND_ORIGIN: !Ref AmplifyDomain
          LLM_API_KEY: !If [HasLlmApiKey, !Ref LlmApiKey, !Ref "AWS::NoValue"]
          ZILLIZ_URI: !If [HasZillizUri, !Ref ZillizUri, !Ref "AWS::NoValue"]
          ZILLIZ_TOKEN: !If [HasZillizToken, !Ref ZillizToken, !Ref "AWS::NoValue"]

Outputs:
  LambdaRoleArn:
    Value: !GetAtt LambdaExecutionRole.Arn
    Description: ARN of the Lambda execution role.
  EcrRepositoryUri:
    Value: !Sub
      - "${AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${Repo}"
      - AccountId: !Ref "AWS::AccountId"
        Repo: !Ref EcrRepositoryName
  LambdaFunctionName:
    Value: !Ref FunctionName
    Description: Name of the Lambda function.
  LambdaFunctionArn:
    Value: !GetAtt LambdaFunction.Arn
    Description: ARN of the Lambda function.
  CodeBuildProjectName:
    Value: !Ref CodeBuildProjectName
  CodeBuildLogGroupName:
    Value: !Sub /aws/codebuild/${CodeBuildProjectName}
  CodeBuildServiceRoleArn:
    Value: !GetAtt CodeBuildServiceRole.Arn
  DynamoDbTableName:
    Value: !Ref DynamoDbTableName
  ApiGatewayId:
    Value: !Ref ApiGatewayApi
    Description: API Gateway HTTP API ID.
  ApiGatewayUrl:
    Value: !Sub "https://${ApiGatewayApi}.execute-api.${AWS::Region}.amazonaws.com/"
    Description: Base URL of the deployed API Gateway HTTP API.
  AmplifyDomain:
    Value: !Ref AmplifyDomain
